
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Product</title>
  <style>
#navbar{
     display: flex;
    background-color: bisque;
    height: 50px;
    width: 100%;
    justify-content: space-around;
}
a{
    margin-top: 10px;
    text-decoration: none;
      
}

.navbar{
    display: flex;
    background-color: bisque;
    height: 50px;
    width: 100%;
    justify-content: space-around;
}
.options{
    display: flex;
    align-items: center;
    justify-content: center;
    
}

.options li{
    list-style: none;
    padding: 0px 100px;
    
}

.options li a{
    text-decoration: none;
    color: black;
    font-size: 1rem;
    font-weight: 600;
    transition: 0.5s ease;
    font-size: 2rem;
    font-weight: 600;

}

.options li a:hover{
    color: red;
}
#container div {
  text-align: center;  
}
    #container {
      width: 200px;
      margin: 20px;
      padding: 20px;
      border: 2px solid black;
      text-align: center;
     
    }
    img {
         height: 200px; 
         width: 150px; 
        }
    button {
      margin-top: 10px;
      height: 40px;
      width: 150px;
      border-radius: 10px;
      background-color: skyblue;
      font-size: 16px;
    }
  </style>
</head>
<body>
    <div class="navbar">
        <ul class="options">
           <li> <a href="index.html">Home </a></li>
            <li><a href="Addtocard.html">Card</a></li>
            <li><a href="form.html">Back to form</a></li>
        </ul>   
    </div>

  <div id="container"></div>
</body>

<script>
  let selected = JSON.parse(localStorage.getItem("selectedProduct"));
  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  function showProduct(items) {
    let card = document.createElement("div");

    let Image = document.createElement("img");
    Image.setAttribute("src", items.image)

    let ProductName = document.createElement("h2");
    ProductName.innerText = items.ProductName;

    let description = document.createElement("p");
    description.textContent = items.description;

    let price = document.createElement("p");
    price.innerText = `₹${items.price}`;

    let AddCart = document.createElement("button");
    AddCart.innerText = "Add to Cart";

    AddCart.addEventListener("click", () => {
      cart.push(items);
      localStorage.setItem("cart", JSON.stringify(cart));
     
    });

    card.append(Image, ProductName, description, price, AddCart);
    document.getElementById("container").appendChild(card);
  }

  showProduct(selected);
</script>
</html>
